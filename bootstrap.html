<!DOCTYPE html>
<html lang="mn" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Фото цомог</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --brand-color: #6f42c1; }
        .btn-brand { background-color: var(--brand-color); color: white; border: none; }
        .btn-brand:hover { background-color: #59339d; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a class="navbar-brand" href="#">Фото Цомог (Bootstrap)</a>
            <button class="btn btn-outline-secondary" onclick="toggleDarkMode()">Dark Mode</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Зургийн жагсаалт</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
            <!-- Карт 1 -->
            <div class="col">
                <div class="card h-100">
                    <!-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО -->
                    <img src="img/photo1.png" class="card-img-top" alt="Хөвсгөл аймаг">
<div class="card-body">
    <h5 class="card-title">Хөвсгөл аймаг</h5>
    <button class="btn btn-brand">Дэлгэрэнгүй</button>
</div>
                </div>
            </div>
            <!-- Карт 2 -->
            <div class="col">
                <div class="card h-100">
                    <!-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО -->
                    <img src="img/photo2.png" class="card-img-top" alt="Төв аймаг">
                    <div class="card-body">
                        <h5 class="card-title">Төв аймаг</h5>
                        <button class="btn btn-brand">Дэлгэрэнгүй</button>
                    </div>
                </div>
            </div>
            <!-- Карт 3 -->
            <div class="col">
                <div class="card h-100">
                    <!-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО -->
                    <img src="img/photo3.png" class="card-img-top" alt="Өмнөговь">
                    <div class="card-body">
                        <h5 class="card-title">Өмнөговь</h5>
                        <button class="btn btn-brand">Дэлгэрэнгүй</button>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="mb-4">Зураг нэмэх</h2>
        <form class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="imgTitle" class="form-label">Зургийн гарчиг</label>
                <input type="text" class="form-control" id="imgTitle" required>
                <div class="invalid-feedback">Гарчиг оруулна уу!</div>
            </div>
            <button class="btn btn-brand" type="submit">Илгээх</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function toggleDarkMode() {
            const html = document.documentElement;
            html.setAttribute('data-bs-theme', html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        }
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
