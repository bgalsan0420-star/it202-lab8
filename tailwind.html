<!DOCTYPE html>
<html lang="mn" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind - Фото цомог</title>
    <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white transition-colors duration-200">
    
    <nav class="bg-gray-100 dark:bg-gray-800 p-4 shadow-sm">
        <div class="container mx-auto flex justify-between items-center">
            <a href="#" class="text-xl font-bold">Фото Цомог (Tailwind)</a>
            <button onclick="document.documentElement.classList.toggle('dark')" class="px-4 py-2 border border-gray-400 rounded hover:bg-gray-200 dark:hover:bg-gray-700">Dark Mode</button>
        </div>
    </nav>

    <div class="container mx-auto mt-8 px-4">
        <h2 class="text-2xl font-bold mb-4">Зургийн жагсаалт</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Карт 1 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden border dark:border-gray-700">
                <!-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО -->
             <img src="img/photo1.png" alt="Хөвсгөл аймаг" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h5 class="text-lg font-semibold mb-3">Хөвсгөл аймаг</h5>
                    <button class="bg-brand hover:bg-purple-800 text-white px-4 py-2 rounded">Дэлгэрэнгүй</button>
                </div>
            </div>
            <!-- Карт 2 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden border dark:border-gray-700">
                <!-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО -->
                 <img src="img/photo2.png" alt="Төв аймаг" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h5 class="text-lg font-semibold mb-3">Төв аймаг</h5>
                    <button class="bg-brand hover:bg-purple-800 text-white px-4 py-2 rounded">Дэлгэрэнгүй</button>
                </div>
            </div>
            <!-- Карт 3 -->
            <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden border dark:border-gray-700">
                <!-- ЭНД ЗУРГИЙН НЭРИЙГ СОЛИНО -->
                <img src="img/photo3.png" alt="Өмнөговь" class="w-full h-48 object-cover">
                <div class="p-4">
                    <h5 class="text-lg font-semibold mb-3">Өмнөговь</h5>
                    <button class="bg-brand hover:bg-purple-800 text-white px-4 py-2 rounded">Дэлгэрэнгүй</button>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-4">Зураг нэмэх</h2>
        <form class="max-w-md" onsubmit="event.preventDefault(); alert('Амжилттай!');">
            <div class="mb-4">
                <label for="imgTitle" class="block mb-2 text-sm font-medium">Зургийн гарчиг</label>
                <input type="text" id="imgTitle" required class="peer bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand focus:border-brand block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white invalid:[&:not(:placeholder-shown):not(:focus)]:border-red-500" placeholder="Гарчиг оруулна уу">
                <p class="mt-2 text-sm text-red-600 hidden peer-invalid:[&:not(:placeholder-shown):not(:focus)]:block">Гарчиг заавал оруулна уу!</p>
            </div>
            <button type="submit" class="bg-brand hover:bg-purple-800 text-white font-medium rounded-lg text-sm px-5 py-2.5">Илгээх</button>
        </form>
    </div>
</body>
</html>
